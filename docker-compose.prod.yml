# Прод: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Не правьте docker-compose.yml на сервере — только этот overlay + .env

services:
  bot:
    build:
      args:
        PIP_INDEX_URL: https://pypi.org/simple
    # Compose merge дописывает ports — !reset убирает 8080:8080 из base
    ports: !reset
      - "127.0.0.1:8081:8080"
